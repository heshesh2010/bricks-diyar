name: android_mvvm_module
description: A brick to create Android Kotlin MVVM module with clean architecture
version: 0.1.0+1

environment:
  mason: ">=0.1.0-dev.51 <1.0.0"

vars:
  organization:
    type: string
    description: The organization domain (e.g., kcb)
    default: kcb
    prompt: What is your organization domain?
  projectName:
    type: string
    description: The project name (e.g., community)
    default: community
    prompt: What is your project name?
  name:
    type: string
    description: The name of the feature module
    prompt: What is the name of your feature?
  hasService:
    type: boolean
    description: Include a service layer?
    default: true
    prompt: Do you want to include a service layer?
  hasLocalData:
    type: boolean
    description: Include a local data source?
    default: false
    prompt: Do you want to include a local data source?
  hasRemoteData:
    type: boolean
    description: Include a remote data source?
    default: true
    prompt: Do you want to include a remote data source?
